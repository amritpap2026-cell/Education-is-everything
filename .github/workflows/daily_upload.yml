name: Daily AI Video Upload

on:
  schedule:
    - cron: '30 19 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recreate Secret Files
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf "%s" "$ENV_FILE" > .env
          printf "%s" "$CLIENT_SECRET_JSON" > client_secret.json
          printf "%s" "$YOUTUBE_TOKEN_JSON" > youtube-token.json
          
          python -c "import json; d = {'English': {'playlist_id': 'PLXtXoI8JqBcI', 'privacy': 'public', 'category_id': '27', 'default_language': 'en'}, 'Hindi': {'playlist_id': 'PLUs3JAt3IsQI', 'privacy': 'public', 'category_id': '27', 'default_language': 'hi'}, 'Nepali': {'playlist_id': 'PLYr-1hw4Pgbo', 'privacy': 'public', 'category_id': '27', 'default_language': 'ne'}}; open('playlists.json', 'w').write(json.dumps(d))"

      - name: Auto-Generate Topics if Low
        run: python queue_generator.py

      - name: Run Scheduler
        run: python scheduler.py

      - name: Commit and Push Queue Update
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add topics_queue.json
          git commit -m "Mark video as done [skip ci]" || echo "No changes to commit"
          git push
